<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Apolo">
<meta name="theme-color" content="#eef1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1310" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>Partidos Juvenil Apolo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<link rel="icon" href="icons/icon-192.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Plan: hoja de partido de banquillo — papel con tinte verde, tinta casi negra, césped profundo con tiza,
   un único acento bermellón para las acciones. Rótulos condensados de marcador de estadio + sans legible. */
:root {
  --paper: #eef1ea; --card: #ffffff; --ink: #142019; --muted: #5b6a61; --line: #d6ddd4;
  --pitch: #2a6a45; --pitch2: #2f744c; --chalk: rgba(255,255,255,.78);
  --accent: #c4471d; --accent-ink: #ffffff;
  --yellow: #f2c230; --red: #d4352c; --good: #2d8a4e; --warn: #b7791f;
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Instrument Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1310; --card: #16201a; --ink: #e5ece6; --muted: #93a299; --line: #29352e;
    --pitch: #1d4d33; --pitch2: #215738; --chalk: rgba(255,255,255,.6);
    --accent: #ec6a3d; --accent-ink: #160b06; --good: #4fb071; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1310; --card: #16201a; --ink: #e5ece6; --muted: #93a299; --line: #29352e;
  --pitch: #1d4d33; --pitch2: #215738; --chalk: rgba(255,255,255,.6);
  --accent: #ec6a3d; --accent-ink: #160b06; --good: #4fb071; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.4; }
body { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
input[type="date"], input[type="time"] { -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%; text-align: left; line-height: 1.25; }
input::-webkit-date-and-time-value { text-align: left; margin: 0; }
input, textarea, select { font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 12px; width: 100%; min-height: 46px; }
output.ro { display: flex; align-items: center; min-height: 46px; padding: 11px 12px; border-radius: 10px; background: color-mix(in srgb, var(--ink) 5%, transparent); font-variant-numeric: tabular-nums; font-weight: 600; }
textarea { resize: vertical; line-height: 1.45; }
.ic { width: 18px; height: 18px; flex: none; vertical-align: -3px; }
.muted { color: var(--muted); } .small { font-size: 13.5px; } .center { text-align: center; }
.pad { padding: 12px 16px 24px; display: grid; gap: 14px; max-width: 640px; margin: 0 auto; }

/* barra superior */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.matchup { display: flex; align-items: baseline; gap: 7px; min-width: 0; flex: 1; font-family: var(--display); font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: .01em; }
.matchup .vs { font-size: 14px; color: var(--muted); font-weight: 600; }
.matchup .them { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.sync { font-size: 12.5px; font-weight: 600; padding: 7px 11px; border-radius: 999px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; max-width: 56vw; overflow: hidden; text-overflow: ellipsis; }
.sync.ok { color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); }
.sync.off { color: var(--muted); background: color-mix(in srgb, var(--muted) 14%, transparent); }
.sync.busy { color: var(--ink); background: color-mix(in srgb, var(--ink) 8%, transparent); }
.sync.dirty { color: var(--accent-ink); background: var(--accent); }
.spin { width: 11px; height: 11px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.banner { margin: 10px 16px 0; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--warn) 13%, var(--card)); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); font-size: 14px; }
.pad .banner { margin: 0; }
.banner.err { background: color-mix(in srgb, var(--red) 11%, var(--card)); border-color: color-mix(in srgb, var(--red) 35%, transparent); }
.link { color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; padding: 6px 0; text-align: left; }
.link.danger, .btn.danger { color: var(--red); }

/* raíl de jornadas */
.rail { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 4px; scroll-snap-type: x proximity; scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.jchip { flex: none; scroll-snap-align: center; display: grid; grid-template-columns: auto auto; column-gap: 6px; align-items: baseline; padding: 8px 12px; border-radius: 12px; background: var(--card); border: 1.5px solid var(--line); text-align: left; position: relative; }
.jchip b { font-family: var(--display); font-size: 19px; font-weight: 800; }
.jchip span { font-size: 13px; font-weight: 600; color: var(--muted); max-width: 92px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jchip em { grid-column: 1 / -1; }

.jchip.dirty::after { content: ""; position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

/* pasos */
.steps { display: flex; gap: 4px; overflow-x: auto; padding: 8px 16px 0; scrollbar-width: none; }
.steps::-webkit-scrollbar { display: none; }
.steps button { flex: none; display: flex; align-items: center; gap: 6px; padding: 9px 12px; border-radius: 999px; font-weight: 600; font-size: 14.5px; color: var(--muted); }
.steps button i { font-style: normal; font-family: var(--display); font-weight: 800; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; border: 1.5px solid currentColor; }
.steps button.on { color: var(--ink); background: var(--card); box-shadow: 0 1px 0 var(--line), 0 0 0 1.5px var(--line) inset; }
.steps button.on i { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* piezas */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; }
.h { font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1; margin: 0; text-transform: uppercase; text-wrap: balance; }
.h3 { font-family: var(--display); font-weight: 800; font-size: 21px; margin: 6px 0 -4px; text-transform: uppercase; display: flex; gap: 8px; align-items: baseline; }
.h3 .muted { font-family: var(--body); font-size: 13px; text-transform: none; font-weight: 500; }
.h4 { margin: 4px 0 0; font-size: 14px; color: var(--muted); font-weight: 600; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.fld { display: grid; gap: 5px; min-width: 0; }
.fld > span { font-size: 13px; font-weight: 600; color: var(--muted); }
.row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.row2b { display: grid; grid-template-columns: minmax(0, 1fr) 92px; gap: 8px; }
.btn { min-height: 48px; padding: 10px 16px; border-radius: 12px; background: var(--card); border: 1.5px solid var(--line); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.btn.ghost { background: transparent; }
.btn.wide { width: 100%; }
a.btn { text-decoration: none; color: var(--ink); text-align: center; }
.btn.big { min-height: 58px; font-size: 18px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.on { border-color: var(--ink); box-shadow: 0 0 0 1.5px var(--ink) inset; }
.btn:disabled { opacity: .55; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.chips.tight { gap: 4px; }
.chip { min-height: 38px; padding: 7px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font-size: 14px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.sm { min-height: 32px; padding: 4px 9px; font-size: 12.5px; }
.chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip .ic { width: 15px; height: 15px; color: var(--yellow); }
.sumline { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.sumline .sp { flex: 1; }
.big { font-family: var(--display); font-size: 30px; font-weight: 800; line-height: 1; }
.disc { width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; background: var(--ink); color: var(--paper); font-family: var(--display); font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; position: relative; }
.disc.sm { width: 24px; height: 24px; font-size: 13px; }
.tag { font-style: normal; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); margin-left: 8px; vertical-align: 2px; letter-spacing: .03em; }

/* convocatoria */
.list { display: grid; gap: 6px; }
.prow { display: flex; align-items: center; gap: 12px; padding: 8px 12px; min-height: 54px; border-radius: 12px; background: var(--card); border: 1.5px solid var(--line); text-align: left; }
.prow .pn { flex: 1; font-weight: 600; }
.prow .chk { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
.prow.on { border-color: color-mix(in srgb, var(--good) 55%, var(--line)); }
.prow.on .chk { background: var(--good); border-color: var(--good); }
.prow.on .chk::after { content: ""; width: 7px; height: 12px; border: solid #fff; border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -1px); }
.prow:not(.on) .disc { background: color-mix(in srgb, var(--ink) 25%, transparent); }
.prow .x { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; font-size: 20px; color: var(--muted); }

/* campo */
.pitch { position: relative; width: min(100%, calc(60vh * .755)); aspect-ratio: 68 / 90; margin: 0 auto; border-radius: 16px; overflow: hidden;
  background: repeating-linear-gradient(180deg, var(--pitch) 0 10%, var(--pitch2) 10% 20%); box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.pitch .lines { position: absolute; inset: 0; width: 100%; height: 100%; }
.tok { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 2px; min-width: 64px; padding: 2px; color: #fff; z-index: 1; }
.tok .disc { width: 40px; height: 40px; font-size: 20px; background: #f7f7f2; color: #142019; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
.tok .nm { font-size: 11.5px; font-weight: 700; line-height: 1.1; padding: 2px 6px; border-radius: 6px; background: rgba(10,20,14,.62); max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: .02em; }
.tok .mins { font-family: var(--display); font-size: 13px; font-weight: 700; line-height: 1; color: rgba(255,255,255,.85); font-variant-numeric: tabular-nums; }
.tok.empty .disc { background: transparent; color: #fff; border: 2px dashed rgba(255,255,255,.75); box-shadow: none; }
.tok.empty .nm { background: transparent; }
.tok .cap { position: absolute; top: -5px; left: -7px; }
i.cap { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: #fff; font-style: normal; font-family: var(--body); font-size: 10.5px; font-weight: 800; display: inline-grid; place-items: center; border: 1.5px solid #fff; }
i.cap.inl { position: static; border-color: transparent; vertical-align: 1px; }
.tok .yc { position: absolute; top: -4px; right: -5px; width: 12px; height: 16px; border-radius: 2px; background: var(--yellow); font-style: normal; font-size: 9px; color: #000; display: grid; place-items: center; font-family: var(--body); font-weight: 800; }
.tok .gl { position: absolute; bottom: -5px; right: -9px; height: 18px; min-width: 18px; padding: 0 3px; border-radius: 9px; background: #fff; color: #142019; display: inline-flex; align-items: center; gap: 1px; font-style: normal; font-size: 10px; font-family: var(--body); font-weight: 800; }
.tok .gl .ic { width: 13px; height: 13px; }
.benchrow { display: flex; flex-wrap: wrap; gap: 6px; }
.bchip { display: inline-flex; align-items: center; gap: 7px; min-height: 42px; padding: 5px 12px 5px 6px; border-radius: 999px; background: var(--card); border: 1.5px solid var(--line); font-weight: 600; font-size: 14px; }
.bchip small { color: var(--muted); font-variant-numeric: tabular-nums; }
.bchip.dim { opacity: .5; }
.formline { display: flex; justify-content: center; gap: 10px; align-items: baseline; margin-top: -6px; }

/* directo */
.board { background: var(--ink); color: var(--paper); border-radius: 18px; padding: 14px 14px 12px; display: grid; gap: 8px; }
.score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
.score .t { font-family: var(--display); font-weight: 700; font-size: 17px; text-transform: uppercase; letter-spacing: .02em; opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score .t:last-child { text-align: right; }
.score b { font-family: var(--display); font-weight: 900; font-size: 64px; line-height: .9; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.score b i { font-style: normal; opacity: .45; padding: 0 6px; font-weight: 600; }
.clockrow { display: flex; justify-content: center; align-items: baseline; gap: 10px; }
.clockrow .phase { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .7; }
.clock { font-family: var(--display); font-weight: 800; font-size: 30px; font-variant-numeric: tabular-nums; color: var(--yellow); }
.board .link { color: var(--paper); opacity: .8; font-size: 14px; }
.phasebtns { display: flex; gap: 8px; justify-content: center; }
.phasebtns .btn.ghost { color: var(--paper); border-color: color-mix(in srgb, var(--paper) 30%, transparent); }
.quick { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.quick .btn { min-height: 52px; padding: 8px; font-size: 14px; flex-direction: column; gap: 3px; line-height: 1.1; }
.btn.goal { background: var(--good); border-color: var(--good); color: #fff; }
.btn.rgoal { border-color: color-mix(in srgb, var(--red) 50%, var(--line)); color: var(--red); }
.cardic { width: 11px; height: 15px; border-radius: 2px; display: inline-block; flex: none; box-shadow: 0 0 0 1px rgba(0,0,0,.12); }
.cardic.y { background: var(--yellow); } .cardic.r { background: var(--red); }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.log button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); text-align: left; min-height: 48px; }
.log .lm { font-family: var(--display); font-weight: 800; font-size: 18px; width: 44px; font-variant-numeric: tabular-nums; }
.log .lt { flex: 1; display: grid; font-size: 14.5px; }
.log .lt small { color: var(--muted); }
.log li.ev-goal .lm { color: var(--good); } .log li.ev-rgoal .lm { color: var(--red); }

/* cierre */
.result .resrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.result .resrow div, .halves div, .tile { display: grid; gap: 2px; padding: 10px; border-radius: 10px; background: var(--paper); }
.result small, .halves small, .tile small { font-size: 12px; color: var(--muted); font-weight: 600; }
.result b, .halves b, .tile b { font-family: var(--display); font-size: 30px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.result .resrow .fin { background: var(--ink); color: var(--paper); } .result .resrow .fin small { color: color-mix(in srgb, var(--paper) 70%, transparent); }
.tablewrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
tbody th { text-align: left; font-weight: 600; position: sticky; left: 0; background: var(--paper); z-index: 1; padding-right: 8px; }
tbody th .disc { margin-right: 6px; vertical-align: middle; }
thead th { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.cin { width: 44px; min-height: 36px; padding: 4px; text-align: center; border-radius: 8px; font-variant-numeric: tabular-nums; }
.cin.w { width: 62px; }
.cin.ovr { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, var(--card)); }
.pillT, .pillS { font-size: 11px; padding: 2px 6px; border-radius: 6px; }
.pillT { background: var(--ink); color: var(--paper); } .pillS { background: var(--line); }
.mvpi { font-style: normal; font-size: 10px; font-weight: 800; color: #6b4e00; background: var(--yellow); padding: 1px 4px; border-radius: 4px; }

/* estadísticas */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: color-mix(in srgb, var(--ink) 7%, transparent); padding: 3px; border-radius: 12px; gap: 3px; }
.seg button { min-height: 40px; border-radius: 9px; font-weight: 700; font-size: 14.5px; color: var(--muted); display: inline-flex; gap: 6px; justify-content: center; align-items: center; }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.seg.mini { width: 104px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--card); border: 1px solid var(--line); }
.tiles.small .tile { background: var(--paper); border: 0; }
.tiles.small b { font-size: 24px; }
@media (max-width: 560px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
.results { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; }
.res { display: grid; gap: 1px; padding: 7px 8px; border-radius: 10px; background: var(--paper); text-align: left; border-left: 4px solid var(--line); position: relative; }
.res small { font-size: 11px; color: var(--muted); font-weight: 700; }
.res b { font-family: var(--display); font-size: 22px; font-weight: 800; line-height: 1; }
.res span { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res i { position: absolute; top: 6px; right: 7px; font-style: normal; font-size: 11px; font-weight: 800; }
.res.w { border-left-color: var(--good); } .res.w i { color: var(--good); }
.res.d { border-left-color: var(--warn); } .res.d i { color: var(--warn); }
.res.l { border-left-color: var(--red); } .res.l i { color: var(--red); }
.halves { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.halves b i { font-style: normal; opacity: .4; padding: 0 3px; }
.bars { display: grid; gap: 7px; }
.bar { display: grid; grid-template-columns: 96px 1fr 34px; align-items: center; gap: 8px; font-size: 13px; }
.bl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-weight: 600; }
.bt { height: 12px; background: color-mix(in srgb, var(--ink) 6%, transparent); border-radius: 0 4px 4px 0; overflow: hidden; }
.bf { display: block; height: 100%; background: var(--pitch2); border-radius: 0 4px 4px 0; min-width: 2px; }
.bv { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
table.stats thead th { position: sticky; top: 0; background: var(--paper); }
table.stats thead th button { font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; padding: 6px 2px; min-height: 36px; }
table.stats thead th button.on { color: var(--accent); }
table.stats tbody tr { cursor: pointer; }
table.stats td { padding: 10px 6px; }
.pct { display: block; font-size: 10.5px; color: var(--muted); }
.scout .scoutres { display: flex; align-items: baseline; gap: 12px; }

function sheetShort(title) {

// Valoraciones del campo (fila VALORACIONES del Excel): clave, cabecera en el Excel, texto en la app
const VAL_FIELDS = [['vest', 'VESTUARIO', 'Vestuario'], ['duch', 'DUCHAS', 'Duchas'], ['bal', 'BALONES', 'Balones'], ['terr', 'TERRENO', 'Terreno de juego'], ['aten', 'ATENCION', 'Atención']];

// ---- Lectura de la estructura de una hoja de jornada ----
function parseLayout(rows) {
  const R = rows || [];
  const c = (r, k) => (r < 0 ? '' : str((R[r] || [])[k]));
  const find = (pred, from = 0) => { for (let i = Math.max(0, from); i < R.length; i++) if (pred(R[i] || [], i)) return i; return -1; };
  const hdr = find(r => up(r[0]) === 'JUGADORA' && up(r[2]) === 'TITULAR');
  if (hdr < 0) throw new Error('No encuentro la tabla de jugadoras (fila con JUGADORA / TITULAR).');
  const fence = find(r => up(r[7]) === 'SISTEMAS' || up(r[0]) === 'RIVAL', hdr + 1);
  const firstEmpty = find(r => !str(r[0]), hdr + 1);
  let total = find(r => !str(r[0]) && str(r[4]) !== '', hdr + 1);
  if (total < 0 || (fence > 0 && total >= fence)) total = firstEmpty;
  const players = [];
  for (let i = hdr + 1; i < total; i++) {
    const r = R[i] || [];
    players.push({ idx: i, name: str(r[0]), dorsal: str(r[1]), blank: !str(r[0]),
      tit: isTrue(r[2]), sup: isTrue(r[3]), min: str(r[4]), pos: str(r[5]), g: str(r[6]), a: str(r[7]),
      mvp: isTrue(r[8]), gp: str(r[9]), ta: str(r[10]), tr: str(r[11]), cap: isTrue(r[12]) });
  }
  const sist = find(r => up(r[7]) === 'SISTEMAS', total);
  const rh = find(r => up(r[0]) === 'JUGADORA' && noacc(up(r[2])).startsWith('POSICION'), total);
  const plan = find(r => up(r[0]).startsWith('PLANTEAMIENTO'), total);
  const cron = find(r => noacc(up(r[0])).startsWith('CRONICA 1'), total);
  const gh = find(r => up(r[0]) === 'MINUTO' && up(r[1]) === 'DORSAL', Math.max(total, cron));
  const obs = find(r => noacc(up(r[0])).startsWith('OBSERVACIONES'), total);
  // POSITIVO / A MEJORAR: celdas combinadas bajo las observaciones, con la etiqueta delante del texto
  const lab = (re, off) => { let i = obs >= 0 ? find(r => re.test(noacc(up(r[0]))), obs + 1) : -1; if (i < 0 && obs >= 0) i = obs + off; return i; };
  const pos = lab(/^POSITIVO/, 5), mej = lab(/^A MEJORAR/, 7);
  const stripLab = (t, re) => str(t).replace(re, '').trim();
  const val = find(r => noacc(up(r[0])).startsWith('VALORACION'), total);
  const valCols = {}, vals = {};
  if (val >= 0) {
    const lab = R[val + 1] || [];
    for (const [k, name] of VAL_FIELDS) {
      const col = lab.findIndex(x => noacc(up(x)).startsWith(name));
      if (col >= 0) { valCols[k] = col; vals[k] = c(val + 2, col); }
    }
  }
  const rivalPlayers = [];
  if (rh >= 0) for (let i = rh + 1; i <= rh + 11; i++) {
    const p = { name: c(i,0), dorsal: c(i,1), pos: c(i,2), goals: c(i,3), cards: c(i,4), note: c(i,5) };
    if (p.name || p.dorsal || p.note) rivalPlayers.push(p);
  }
  const goals = { ours: [], theirs: [] };
  if (gh >= 0) for (let i = gh + 1; i <= gh + 11; i++) {
    if (c(i,0) || c(i,1) || c(i,2)) goals.ours.push([c(i,0), c(i,1), c(i,2)]);
    if (c(i,4) || c(i,6) || c(i,7)) goals.theirs.push([c(i,4), c(i,6), c(i,7)]);
  }
  return {
    hdr, total, players, hasCap: up(c(hdr,12)) === 'CAP',
    sist, rh, plan, cron, gh, obs, pos, mej, val, valCols, vals,
    title: c(1,0), rival: c(4,0), team: c(13,0),
    lugar: c(7,3), fecha: c(8,3), hora: c(9,3), cit: c(10,3),
    h1: c(7,10), h2: c(8,10), final: c(10,10),
    ourForm: sist >= 0 ? c(sist+2,7) : '',
    rivalName: rh >= 0 ? c(rh+12,7) : '', rivalForm: rh >= 0 ? c(rh+13,7) : '',
    rivalPlayers, goals,
    plan_t: plan >= 0 ? c(plan+1,0) : '', cron1: cron >= 0 ? c(cron+1,0) : '', cron2: cron >= 0 ? c(cron+1,4) : '',
    obs_t: obs >= 0 ? c(obs+1,0) : '',
    pos_t: pos >= 0 ? stripLab(c(pos,0), /^\s*POSITIVO\s*:?\s*/i) : '', mej_t: mej >= 0 ? stripLab(c(mej,0), /^\s*A MEJORAR\s*:?\s*/i) : '',
  };
}

// Nota de una destacada del rival: «Goleadora» (etiqueta) + datos de temporada de la federación (solo en la app) + tu nota.
// En el Excel solo va «Goleadora, tu nota».
function splitNote(note, auto = true) { // auto = false: del Excel, solo se separa la etiqueta
  let t = str(note).trim(), tag = ''; const info = [];
  const g = t.match(/^goleadora\b/i); if (g) { tag = g[0]; t = t.slice(g[0].length); }
  for (;auto;) {
    t = t.replace(/^[\s·,.:;\-–]+/, '');
    const m = t.match(/^(\d+ gol(?:es)?(?: \(\d+ pen\.\))?|\d+ amarillas?|\d+ rojas?)(?![\p{L}\d])/u);
    if (!m) break; info.push(m[1]); t = t.slice(m[0].length);
  }
  return { tag, info: info.join(' · '), note: (tag ? t.replace(/^[\s·,.:;\-–]+/, '') : t).trim() };
}
const joinNote = p => [str(p.tag), str(p.note)].filter(Boolean).join(', ');

function parseCards(s) {
  s = up(s); const a = s.match(/(\d+)\s*A/); const r = s.match(/(\d+)\s*R/);
  return { y: a ? +a[1] : (/\bA\b/.test(s) ? 1 : 0), r: r ? +r[1] : (/\bR\b/.test(s) ? 1 : 0) };
}
const fmtCards = (y, r) => [y ? y + 'A' : '', r ? r + 'R' : ''].filter(Boolean).join(' ');

function matchFromLayout(sheet, L) {
  const m = {
    v: 1, sheetId: sheet.id, title: sheet.title, team: L.team || 'C.D. APOLO',
    info: { rival: L.rival || sheetShort(sheet.title).name, lugar: L.lugar, fecha: parseFecha(L.fecha), hora: stripH(L.hora), cit: stripH(L.hora) ? stripH(L.cit) : '' },
    roster: [], called: {}, formation: guessFormation(L.ourForm) || DEFAULT_FORMATION, formationText: L.ourForm || '',
    lineup: {}, captain: null,
    rival: { name: L.rivalName || L.rival || '', formation: L.rivalForm || '',
      players: L.rivalPlayers.map(p => { const cc = parseCards(p.cards); return { name: p.name, dorsal: p.dorsal, pos: p.pos, goals: toInt(p.goals), y: cc.y, r: cc.r, ...splitNote(p.note, false) }; }) },
    clock: { phase: 'pre' }, events: [], mvp: {},
    texts: { plan: L.plan_t, cron1: L.cron1, cron2: L.cron2, obs: L.obs_t, pos: L.pos_t || '', mej: L.mej_t || '' },
    vals: { ...(L.vals || {}) },
    ov: {}, imp: null, savedAt: null, dirty: false, seq: 1,
  };
  for (const p of L.players) if (!p.blank) m.roster.push({ id: pkey(p.name, p.dorsal), name: p.name, dorsal: p.dorsal, extra: false });
  // Jugado = hay resultado o estadísticas. Con solo convocatoria/once guardados, el partido aún no se ha jugado.
  const hasStats = L.players.some(p => p.min || p.g || p.a || p.gp || p.ta || p.tr || p.mvp);
  const played = !!L.final || hasStats;
  if (!played) {
    const slots0 = FORMATIONS[m.formation];
    for (const p of L.players) {
      if (p.blank || !(p.tit || p.sup)) continue;
      const id = pkey(p.name, p.dorsal);
      m.called[id] = true; if (p.cap) m.captain = id;
      if (p.tit) { const s = toInt(p.pos.split(/\s+/)[0]); if (slots0[s] && !m.lineup[s]) m.lineup[s] = id; }
    }
  }
  if (played) {
    m.imp = { score: { h1: L.h1, h2: L.h2, final: L.final }, goals: L.goals };
    m.clock.phase = 'end';
    m.finalized = !!L.final; // con resultado en el Excel: jornada finalizada
    const slots = FORMATIONS[m.formation];
    for (const p of L.players) {
      if (p.blank || !(p.tit || p.sup)) continue;
      const id = pkey(p.name, p.dorsal);
      m.called[id] = true;
      if (p.mvp) m.mvp[id] = true;
      if (p.cap) m.captain = id;
      m.ov[id] = { min: p.min, pos: p.pos, g: p.g, a: p.a, gp: p.gp, ta: p.ta, tr: p.tr };
      if (p.tit) { const s = toInt(p.pos.split(/\s+/)[0]); if (slots[s] && !m.lineup[s]) m.lineup[s] = id; }
    }
  }
  return m;
}

// ---- Minutos y estadísticas a partir de los eventos ----
function eff(min, half, H) { min = +min || 0; return half === 1 ? Math.max(0, Math.min(min, H)) : Math.max(H, Math.min(min, 2 * H)); }
function fmtMin(min, half, H) { min = +min || 0; const cap = half === 1 ? H : 2 * H; return min > cap ? `${cap}+${min - cap}` : String(min); }
function clockMinute(clock, H, now = Date.now()) {
  // minuto por el que vamos: con 11:53 en el reloj es el 11
  if (clock.phase === 'h1') return Math.floor((now - clock.h1Start) / 60000);
  if (clock.phase === 'h2') return H + Math.floor((now - clock.h2Start) / 60000);
  if (clock.phase === 'ht') return H;
  if (clock.phase === 'end') return 2 * H;
  return 1;
}
function clockHalf(clock) { return clock.phase === 'h2' || clock.phase === 'end' ? 2 : 1; }
function sortedEvents(m) { return [...m.events].sort((a, b) => a.half - b.half || a.min - b.min || a.seq - b.seq); }

// Posición contabilizada: la jugadora tiene que estar al menos este tiempo en ella (evita huecos «fantasma» al reorganizar)
const MIN_POS_MS = 30000;
function compute(m, H, now = Date.now()) {
  const P = {};
  const called = m.roster.filter(p => m.called[p.id]).map(p => p.id);
  for (const id of called) P[id] = { tit: false, sup: false, min: 0, stints: [], g: 0, a: 0, gp: 0, y: 0, r: 0, on: false, inAt: 0, out: false, expelled: false, leftAt: null };
  const field = {};
  const kickTs = m.clock.h1Start || null;
  // tramos en cada posición: {slot, ts, min, endTs, endMin}
  const open = (id, slot, ts, min) => P[id].stints.push({ slot: +slot, ts: ts ?? null, min, endTs: undefined, endMin: undefined });
  const close = (id, ts, min) => { const s = P[id] && P[id].stints[P[id].stints.length - 1]; if (s && s.endMin === undefined) { s.endTs = ts ?? null; s.endMin = min; } };
  for (const [slot, id] of Object.entries(m.lineup)) if (P[id]) { field[slot] = id; P[id].tit = true; P[id].on = true; P[id].inAt = 0; open(id, slot, kickTs, 0); }
  for (const id of called) if (!P[id].tit) P[id].sup = true;
  const gf = [0, 0], gc = [0, 0];
  const slotOf = id => Object.keys(field).find(s => field[s] === id);
  let curTs = null;
  const leave = (id, at) => { const p = P[id]; if (!p || !p.on) return; p.min += Math.max(0, at - p.inAt); p.on = false; p.leftAt = at; close(id, curTs, at); const s = slotOf(id); if (s) delete field[s]; };
  const ph = m.clock.phase;
  const live = ph === 'h1' || ph === 'h2';
  // sin empezar el directo no hay minutos: se cuentan desde que se pulsa «Empezar 1ª parte»
  let end = live ? eff(clockMinute(m.clock, H, now), ph === 'h1' ? 1 : 2, H) : ph === 'pre' ? 0 : ph === 'ht' ? H : 2 * H;
  if (live || ph === 'ht') for (const e of m.events) end = Math.max(end, eff(e.min, e.half, H));
  for (const e of sortedEvents(m)) {
    const at = eff(e.min, e.half, H);
    curTs = e.ts || null;
    if (e.t === 'goal') { gf[e.half - 1]++; if (P[e.scorer]) P[e.scorer].g++; if (P[e.assist]) P[e.assist].a++; }
    else if (e.t === 'rgoal') { gc[e.half - 1]++; if (P[e.og]) P[e.og].gp++; }
    else if (e.t === 'card' && P[e.pid]) {
      const p = P[e.pid];
      if (e.color === 'Y') { p.y++; if (p.y === 2) { p.expelled = true; leave(e.pid, at); } }
      else { p.r++; p.expelled = true; leave(e.pid, at); }
    }
    else if (e.t === 'sub' && P[e.out] && P[e.in]) {
      // cambios volantes: una jugadora que ya salió puede volver a entrar
      const s = slotOf(e.out); if (!s || P[e.in].on || P[e.in].expelled) continue;
      leave(e.out, at); P[e.out].out = true;
      field[s] = e.in; P[e.in].on = true; P[e.in].inAt = at; open(e.in, s, curTs, at);
    }
    else if (e.t === 'out' && P[e.pid]) { leave(e.pid, at); P[e.pid].out = true; } // sale sin cambio (a respirar)
    else if (e.t === 'in' && P[e.pid]) { // entra a un hueco libre
      const s = String(e.slot); if (field[s] || P[e.pid].on || P[e.pid].expelled) continue;
      field[s] = e.pid; P[e.pid].on = true; P[e.pid].inAt = at; open(e.pid, s, curTs, at);
    }
    else if (e.t === 'move' && P[e.pid]) {
      const from = slotOf(e.pid); if (!from || String(from) === String(e.slot)) continue;
      const other = field[e.slot];
      field[e.slot] = e.pid; close(e.pid, curTs, at); open(e.pid, e.slot, curTs, at);

  for (const id of called) {
    const p = P[id];
    // duración de cada tramo: por la hora real si la hay; si no, por los minutos
    const dur = s => (s.ts != null && s.endTs != null) ? s.endTs - s.ts : (s.endMin === undefined ? Infinity : (s.endMin - s.min) * 60000);
    let keep = p.stints.filter(s => dur(s) >= MIN_POS_MS);
    if (!keep.length && p.stints.length) keep = [p.stints.reduce((a, b) => (dur(b) > dur(a) ? b : a))];
    const d = [];
    for (const s of keep) if (!d.includes(s.slot)) d.push(s.slot); // sin repetir posiciones
    p.pos = d; p.posStr = d.join(' ');

  }

}

function scoreStrings(m, comp, away = false) {

    const s = (a, b) => (away ? `${b} - ${a}` : `${a} - ${b}`);
    return { h1: s(comp.gf[0], comp.gc[0]), h2: s(comp.gf[1], comp.gc[1]), final: s(comp.gf[0] + comp.gf[1], comp.gc[0] + comp.gc[1]), computed: true };
  }
  if (m.imp) return { ...m.imp.score, computed: false };
  return { h1: '', h2: '', final: '', computed: false };
}

const STAT_FIELDS = ['min', 'pos', 'g', 'a', 'gp', 'ta', 'tr'];
function finalStats(m, comp, id) {
  const c = comp.P[id];
  if (!c) return { tit: false, sup: false, min: '', pos: '', g: '', a: '', mvp: false, gp: '', ta: '', tr: '', cap: false, called: false };
  const ov = m.ov[id] || {};
  const z = n => (n ? n : '');
  const comp1 = { min: c.min > 0 ? c.min : '', pos: c.posStr, g: z(c.g), a: z(c.a), gp: z(c.gp), ta: z(c.ta), tr: z(c.tr) };
  const out = { tit: c.tit, sup: c.sup, mvp: !!m.mvp[id], cap: m.captain === id, called: true };
  for (const f of STAT_FIELDS) out[f] = f in ov ? ov[f] : comp1[f];
  return out;
}
function playerRowValues(p, st) {
  return [p.name, toCell(p.dorsal), st.tit, st.sup, toCell(st.min), toCell(st.pos), toCell(st.g), toCell(st.a), st.mvp, toCell(st.gp), toCell(st.ta), toCell(st.tr), st.cap];
}

function goalRows(m, H) {
  if (!hasGoalEvents(m) && m.imp) return { ours: m.imp.goals.ours, theirs: m.imp.goals.theirs };
  const byId = Object.fromEntries(m.roster.map(p => [p.id, p]));
  const ours = [], theirs = [];
  for (const e of sortedEvents(m)) {
    if (e.t === 'goal') ours.push([fmtMin(e.min, e.half, H), e.scorer ? (byId[e.scorer]?.dorsal ?? '') : '', e.desc || (e.scorer ? '' : 'gol en propia rival')]);

  }
  return { ours, theirs };
}

// ---- Resumen de una hoja para estadísticas ----
function summarize(sheet, L, away = false) {
  const sc = s => { const m = str(s).match(/(\d+)\s*-\s*(\d+)/); return m ? [+m[1], +m[2]] : null; };
  const players = L.players.filter(p => !p.blank).map(p => ({
    key: up(p.name), name: p.name, dorsal: p.dorsal, tit: p.tit, sup: p.sup, conv: p.tit || p.sup,
    min: toInt(p.min), pos: p.pos, g: toInt(p.g), a: toInt(p.a), mvp: p.mvp, gp: toInt(p.gp), ta: toInt(p.ta), tr: toInt(p.tr), cap: p.cap,
    played: p.tit || toInt(p.min) > 0 || !!p.pos,
  }));
  const fix = x => (x && away ? [x[1], x[0]] : x);
  const final = fix(sc(L.final));
  return {
    id: sheet.id, title: sheet.title, n: sheetShort(sheet.title).n, rival: L.rival || sheetShort(sheet.title).name,
    rkey: rivalKey(sheetShort(sheet.title).name), fecha: L.fecha, h1: fix(sc(L.h1)), h2: fix(sc(L.h2)), final, away,
    played: !!final || players.some(p => p.tit), players, goals: L.goals,
    ourForm: L.ourForm, rivalForm: L.rivalForm, rivalPlayers: L.rivalPlayers, cron1: L.cron1, cron2: L.cron2, obs: L.obs_t,
  };
}

function aggregate(summaries) {
  const games = summaries.filter(s => s.played).sort((a, b) => a.n - b.n);
  const team = { pj: 0, w: 0, d: 0, l: 0, gf: 0, gc: 0, pts: 0, cs: 0, gf1: 0, gf2: 0, gc1: 0, gc2: 0, tramosF: [0,0,0,0,0,0], tramosC: [0,0,0,0,0,0] };
  const byP = {};
  for (const g of games) {
    if (g.final) {
      team.pj++; const [a, b] = g.final; team.gf += a; team.gc += b;
      if (a > b) { team.w++; team.pts += 3; } else if (a === b) { team.d++; team.pts += 1; } else team.l++;
      if (b === 0) team.cs++;
    }
    if (g.h1) { team.gf1 += g.h1[0]; team.gc1 += g.h1[1]; }

    if (list.length) { S.sheets = list; }
    if (p && p.properties) S.settings.sheetTitle = p.properties.title;
    persist();
    UI.err.sheets = null;
  } catch (e) { UI.err.sheets = errText(e); }
  render();
}

// Citación: siempre 1 h 15 min antes de la hora del partido
const citOf = hora => { const m = str(hora).match(/^(\d{1,2}):(\d{2})/); if (!m) return ''; let t = (+m[1]) * 60 + (+m[2]) - 75; if (t < 0) t += 1440; return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`; };
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
// El lugar se rellena siempre que esté vacío. Fecha y hora solo el mismo día del partido (o al pulsar el botón),
// porque los horarios suelen cambiar durante la semana.
function applyFfcv(m, force = false) {
  const f = ffcvFor(m); if (!f || (m.finalized && !force)) return false;
  const fecha = parseFecha(f.fecha);
  const sameDay = fecha === todayISO();
  const vals = { lugar: lugarFmt(f.campo) };
  if (force || sameDay) { vals.fecha = fecha; vals.hora = f.hora; }
  let ch = false;
  for (const k of Object.keys(vals)) if (vals[k] && (force || !str(m.info[k])) && m.info[k] !== vals[k]) { m.info[k] = vals[k]; ch = true; }
  if (ch) m.dirty = true;
  return ch;
}
// Copias guardadas en el móvil por versiones anteriores de la app
function migrateMatch(m) {
  if (!m.vals) m.vals = {};
  if (!citOf(m.info.hora)) m.info.cit = '';
  if (m.texts.pos == null) m.texts.pos = ''; if (m.texts.mej == null) m.texts.mej = '';
  markFed(m);
  if (m.finalized === undefined && m.imp && m.imp.score && m.imp.score.final && !m.events.length) m.finalized = true;
  // jornadas guardadas solo con convocatoria/once que una versión anterior tomó por jugadas
  if (!m.finalized && m.clock.phase === 'end' && !m.events.length && m.imp && !(m.imp.score && m.imp.score.final)
      && Object.values(m.ov).every(o => ['min', 'g', 'a', 'gp', 'ta', 'tr'].every(k => !str(o[k])))) { m.clock = { phase: 'pre' }; m.imp = null; m.ov = {}; }
}
function seedMatch(sheet) {
  const L = { players: [], rivalPlayers: [], goals: { ours: [], theirs: [] }, rival: sheetShort(sheet.title).name, team: 'C.D. APOLO' };
  const m = matchFromLayout(sheet, L); m.seed = true; applyFfcv(m); m.dirty = false; return m;
}
async function openMatch(id, { reload = false } = {}) {
  S.current = id; persist();
  const sh = sheetById(id); if (!sh) return render();
  const ex = S.matches[id];
  if (ex) migrateMatch(ex);
  // Sin cambios pendientes en el móvil, se lee siempre del Excel: así una jornada ya jugada aparece como finalizada
  if (ex && !reload && ready() && !(ex.dirty || ['h1', 'ht', 'h2'].includes(ex.clock.phase))) reload = true;
  if (S.matches[id] && !reload) applyFfcv(S.matches[id]);
  if (!S.matches[id] || reload) {
    if (!S.matches[id]) S.matches[id] = seedMatch(sh);
    if (ready()) {
      const hadLocal = !!S.matches[id] && !S.matches[id].seed;
      if (!hadLocal) { UI.loading[id] = true; render(); }
      try {
        const rows = await readRows(sh.title); const L = parseLayout(rows);
        const prev = S.matches[id];
        const m = matchFromLayout(sh, L);
        // conserva extras añadidos en la app que aún no están en el Excel
        if (prev && !reload) for (const p of prev.roster) if (p.extra && !m.roster.some(q => q.id === p.id)) m.roster.push(p);
        applyFfcv(m); markFed(m);
        S.matches[id] = m; S.stats.sums[id] = summarize(sh, L, awayOf(sh.title)); UI.err.match = null;
      } catch (e) { UI.err.match = errText(e); }
      UI.loading[id] = false; persist();
    }
  }
  const mm0 = S.matches[id];
  if (mm0 && !reload && ready() && !mm0.finalized) readRows(sh.title).then(rows => { if (infoFromLayout(mm0, parseLayout(rows))) { persist(); render(); } }).catch(() => {});
  const mm = S.matches[id];
  if (mm) { prefillRival(mm); if (!mm.finalized) S.ui.step = autoStep(mm); }
  render();
}
// Paso en el que se abre una jornada: el siguiente pendiente
function autoStep(m) {
  const ph = m.clock.phase;
  if (ph === 'h1' || ph === 'ht' || ph === 'h2') return 'directo';
  if (ph === 'end') return 'cierre';
  const nCalled = m.roster.filter(p => m.called[p.id]).length;
  const nLine = Object.values(m.lineup).filter(id => m.called[id]).length;
  if (nLine >= 11) return 'directo';
  if (nCalled > 0) return 'once';
  return 'previa';
}
// Rival de la jornada según la federación
function ffcvRivalTeam(m) {
  if (!FFCV_SNAP) return null; const f = ffcvFor(m); if (!f) return null;
  const c = teamByName(/apolo/i.test(f.local) ? f.visit : f.local); if (!c) return null;
  return { clas: c, team: FFCV_SNAP.teams.find(x => x.cod === c[1]) || { pl: [], es: [] } };
}
// Destacadas de la federación: goleadoras y jugadoras con tarjetas. Se muestran como sugerencia (fed: true)
// y NO se guardan en el Excel hasta que las modificas (nota, posición, goles, tarjetas…).
// Goles y tarjetas de la ficha quedan a 0: son los de este partido; lo de la temporada va en la nota.
const rpKey = p => str(p.dorsal) ? 'd' + str(p.dorsal) : 'n' + up(p.name);
function ffcvPicks(r) {
  const P = r.team.pl.map(p => ({ n: p[0], d: p[1], pos: p[2], g: p[5], pen: p[6], y: p[8], rr: p[9] }));
  const picked = [];
  for (const p of P.filter(p => p.g > 0).sort((a, b) => b.g - a.g).slice(0, 4)) picked.push({ p, tag: 'Goleadora', info: `${p.g} gol${p.g > 1 ? 'es' : ''}${p.pen ? ` (${p.pen} pen.)` : ''}` });
  for (const p of P.filter(p => p.y >= 2 || p.rr > 0).sort((a, b) => (b.rr * 3 + b.y) - (a.rr * 3 + a.y)).slice(0, 4)) {
    const txt = [p.y ? `${p.y} amarilla${p.y > 1 ? 's' : ''}` : '', p.rr ? `${p.rr} roja${p.rr > 1 ? 's' : ''}` : ''].filter(Boolean).join(', ');
    const ex = picked.find(x => x.p === p); if (ex) ex.info += ' · ' + txt; else picked.push({ p, tag: '', info: txt });
  }
  const posMap = { P: 'POR', MD: 'MC', MI: 'MC' };
  return picked.slice(0, 8).map(({ p, tag, info }) => ({ name: up(nameFmt(p.n)), dorsal: p.d, pos: posMap[p.pos] || p.pos || '', goals: 0, y: 0, r: 0, tag, info, note: '', fed: true }));
}
// Marca como «de la federación» las destacadas sin nada tuyo (copias antiguas o filas que ya estaban en el Excel)
function markFed(m) {
  for (const p of m.rival.players) if (p.tag === undefined) Object.assign(p, splitNote(p.note)); // copias antiguas con «Goleadora · 6 goles» en la nota
  const r = ffcvRivalTeam(m); const fp = r ? r.team.pl.map(p => ({ d: str(p[1]), n: up(nameFmt(p[0])) })) : [];
  for (const p of m.rival.players) {
    if (p.fed !== undefined) continue;
    const blankStats = !(+p.goals) && !(+p.y) && !(+p.r);
    const words = up(p.name).split(/\s+/).filter(w => w.length >= 4);
    const inFfcv = fp.some(x => x.d === str(p.dorsal) && (x.n === up(p.name) || words.some(w => x.n.includes(w))));
    p.fed = blankStats && inFfcv && !str(p.note);
  }
}
function prefillRival(m) {
  if (m.finalized) return false;
  const r = ffcvRivalTeam(m); if (!r) return false;
  let changed = false;
  if (!str(m.rival.formation)) {
    const cnt = r.team.es.reduce((o, e) => (o[e] = (o[e] || 0) + 1, o), {});
    const es = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
    if (es) { m.rival.formation = es[0].replace(/-/g, '.'); m.dirty = true; changed = true; }
  }
  const hide = (S.rivalHide || {})[m.sheetId] || [];
  const have = new Set(m.rival.players.map(rpKey));
  for (const p of ffcvPicks(r)) {
    if (m.rival.players.length >= 11) break;
    const k = rpKey(p); if (have.has(k) || hide.includes(k)) continue;
    m.rival.players.push(p); have.add(k); changed = true;
  }
  return changed;
}

// ===== GUARDAR EN EL EXCEL =====
async function saveToSheet(m) {
  if (UI.sync === 'saving') return;
  if (!ready()) { signIn('save'); return; }
  UI.sync = 'saving'; UI.syncMsg = 'Leyendo la hoja…'; render();
  const step = t => { UI.syncMsg = t; render(); };
  try {
    const t = m.title, shId = m.sheetId, Hh = H();
    let rows = await readRows(t); let L = parseLayout(rows);
    infoFromLayout(m, L); // lo que ya esté en el Excel (p. ej. la revisión del martes) no se pisa con vacíos
    const rowKey = p => pkey(p.name, p.dorsal);
    const findRow = (L, p) => L.players.find(r => !r.blank && rowKey(r) === p.id) || L.players.find(r => !r.blank && up(r.name) === up(p.name));
    const extrasNeeded = m.roster.filter(p => m.called[p.id] && !findRow(L, p));
    const blanks = L.players.filter(r => r.blank);
    const need = extrasNeeded.length - blanks.length;
    if (need > 0) {
      step(`Creando ${need} fila${need > 1 ? 's' : ''} nueva${need > 1 ? 's' : ''}…`);
      const at = L.total; // índice 0 de la fila de totales: las nuevas quedan justo debajo de la última jugadora
      await call('update_spreadsheet', { spreadsheetId: sid(), requests: [
        { insertDimension: { range: { sheetId: shId, dimension: 'ROWS', startIndex: at, endIndex: at + need }, inheritFromBefore: true } },
        { copyPaste: { source: { sheetId: shId, startRowIndex: at - 1, endRowIndex: at, startColumnIndex: 0, endColumnIndex: 13 },
          destination: { sheetId: shId, startRowIndex: at, endRowIndex: at + need, startColumnIndex: 0, endColumnIndex: 13 }, pasteType: 'PASTE_FORMAT' } },
      ] });
      const fill = extrasNeeded.slice(blanks.length);
      await writeVals(`${qs(t)}!A${at + 1}:B${at + need}`, fill.map(p => [p.name, toCell(p.dorsal)]));
      rows = await readRows(t); L = parseLayout(rows);
    }
    // casillas para jugadoras extra en filas vacías existentes
    const freeRows = L.players.filter(r => r.blank);
    const assign = {};
    for (const p of m.roster.filter(p => m.called[p.id] && !findRow(L, p))) { const r = freeRows.shift(); if (r) assign[r.idx] = p; }
    step('Preparando columnas…');
    const fmtReq = [];
    if (!L.hasCap) {
      fmtReq.push({ copyPaste: { source: { sheetId: shId, startRowIndex: L.hdr, endRowIndex: L.total + 1, startColumnIndex: 8, endColumnIndex: 9 },
        destination: { sheetId: shId, startRowIndex: L.hdr, endRowIndex: L.total + 1, startColumnIndex: 12, endColumnIndex: 13 }, pasteType: 'PASTE_FORMAT' } });
      fmtReq.push({ updateDimensionProperties: { range: { sheetId: shId, dimension: 'COLUMNS', startIndex: 12, endIndex: 13 }, properties: { pixelSize: 50 }, fields: 'pixelSize' } });
      fmtReq.push({ updateBorders: { range: { sheetId: shId, startRowIndex: L.hdr, endRowIndex: L.hdr + 1, startColumnIndex: 12, endColumnIndex: 13 }, top: { style: 'SOLID', width: 1, colorStyle: { rgbColor: {} } } } });
    }
    // CAP con casilla de verificación, igual que MVP
    fmtReq.push({ setDataValidation: { range: { sheetId: shId, startRowIndex: L.hdr + 1, endRowIndex: L.total, startColumnIndex: 12, endColumnIndex: 13 }, rule: { condition: { type: 'BOOLEAN' }, showCustomUi: true } } });
    // POSITIVO / A MEJORAR: etiqueta en negrita + texto
    fmtReq.push(...labelCells(shId, L, m.texts));
    if (citOf(m.info.hora)) fmtReq.push({ repeatCell: { range: { sheetId: shId, startRowIndex: 9, endRowIndex: 11, startColumnIndex: 3, endColumnIndex: 4 }, cell: { userEnteredFormat: { numberFormat: { type: 'TIME', pattern: 'hh:mm' } } }, fields: 'userEnteredFormat.numberFormat' } });
    if (fmtReq.length) await call('update_spreadsheet', { spreadsheetId: sid(), requests: fmtReq });
    // hora como hora de verdad (como en tu Excel) y la citación con la fórmula: 1 h 15 antes, vacía si no hay hora
    if (citOf(m.info.hora)) await call('update_formulas', { spreadsheetId: sid(), range: `${qs(t)}!D10:D11`, formulas: [[m.info.hora], [CIT_FORMULA]] });
    await call('update_formulas', { spreadsheetId: sid(), range: `${qs(t)}!E${L.total + 1}`, formulas: [[`=SUM(E${L.hdr + 2}:E${L.total})`]] });

    step('Escribiendo jugadoras…');
    const comp = compute(m, Hh);
    const block = [[null, null, null, null, null, null, null, null, null, null, null, null, 'CAP']];
    for (const r of L.players) {
      const p = r.blank ? assign[r.idx] : (m.roster.find(q => q.id === rowKey(r)) || m.roster.find(q => up(q.name) === up(r.name)));
      if (!p) { block.push(Array(13).fill(null)); continue; } // fila que la app no conoce: no se toca
      const st = finalStats(m, comp, p.id);
      const v = playerRowValues(p, st);
      if (!r.blank) { v[0] = null; v[1] = null; } // no tocamos nombre ni dorsal de la plantilla
      block.push(v);
    }
    const sc = scoreStrings(m, comp, awayOf(m.title));
    const gr = goalRows(m, Hh);
    const pad = (arr, n, w) => { const o = arr.slice(0, n).map(r => r.slice()); while (o.length < n) o.push(Array(w).fill('')); return o; };
    const writes = [
      [`${qs(t)}!A${L.hdr + 1}:M${L.total}`, block],
      [`${qs(t)}!D8:D9`, [[m.info.lugar || null], [fmtFecha(m.info.fecha) || null]]],
      [`${qs(t)}!K8:K11`, [[sc.h1], [sc.h2], [null], [sc.final]]],
    ];
    if (L.rh >= 0) {
      const rp = pad(m.rival.players.filter(p => !p.fed).map(p => [p.name || '', toCell(p.dorsal), p.pos || '', p.goals ? p.goals : '', fmtCards(p.y, p.r), joinNote(p)]), 11, 6);
      writes.push([`${qs(t)}!A${L.rh + 2}:F${L.rh + 12}`, rp]);
      writes.push([`${qs(t)}!H${L.rh + 13}:H${L.rh + 14}`, [[m.rival.name || m.info.rival || ''], [m.rival.formation || '']]]);
    }
    if (L.sist >= 0) writes.push([`${qs(t)}!H${L.sist + 3}`, [[m.formationText || m.formation]]]);
    if (L.plan >= 0) writes.push([`${qs(t)}!A${L.plan + 2}`, [[m.texts.plan || '']]]);
    if (L.cron >= 0) writes.push([`${qs(t)}!A${L.cron + 2}:E${L.cron + 2}`, [[m.texts.cron1 || '', null, null, null, m.texts.cron2 || '']]]);
    if (L.obs >= 0) writes.push([`${qs(t)}!A${L.obs + 2}`, [[m.texts.obs || '']]]);
    const vr = valRow(L, k => { const v = str((m.vals || {})[k]); return v === '' ? '' : (isNaN(+v) ? v : +v); });
    if (vr) writes.push([`${qs(t)}!${vr[0]}`, vr[1]]);
    if (L.gh >= 0) {
      writes.push([`${qs(t)}!A${L.gh + 2}:C${L.gh + 12}`, pad(gr.ours.map(r => [toCell(r[0]), toCell(r[1]), r[2]]), 11, 3)]);
      writes.push([`${qs(t)}!E${L.gh + 2}:H${L.gh + 12}`, pad(gr.theirs.map(r => [toCell(r[0]), null, toCell(r[1]), r[2]]), 11, 4).map(r => [r[0], null, r[2], r[3]])]);
    }
    let done = 0;
    step(`Guardando (0/${writes.length})…`);
    for (let i = 0; i < writes.length; i += 4) {
      await Promise.all(writes.slice(i, i + 4).map(([r, v]) => writeVals(r, v).then(() => { done++; step(`Guardando (${done}/${writes.length})…`); })));
    }
    // colorear el resultado final (K11:L11) y la pestaña: verde victoria, amarillo empate, rojo derrota
    const fin = ourView(sc.final, awayOf(t)).match(/(\d+)\s*-\s*(\d+)/);
    if (fin) {
      const r = +fin[1] > +fin[2] ? 'w' : +fin[1] === +fin[2] ? 'd' : 'l';
      try { await call('update_spreadsheet', { requests: resultColorReqs(shId, r) }); } catch (e) {}
    }
    // refrescar resumen de estadísticas de esta hoja
    try { const rows2 = await readRows(t); S.stats.sums[m.sheetId] = summarize(sheetById(m.sheetId) || { id: m.sheetId, title: t }, parseLayout(rows2), awayOf(t)); } catch (e) {}
    for (const p of m.roster) if (p.extra && !S.extrasPool.some(x => up(x.name) === up(p.name))) S.extrasPool.push({ name: p.name, dorsal: p.dorsal });
    m.dirty = false; m.savedAt = Date.now(); m.seed = false;
    UI.sync = 'ok'; UI.syncMsg = 'Guardado en el Excel';
    persist();
  } catch (e) {
    UI.sync = 'error';
    UI.syncMsg = (e && (e.code === 'server_unavailable' || e.code === 'upstream_error'))
      ? 'No sé si se llegó a guardar (Google no contestó). Vuelve a pulsar Guardar: la app relee el Excel antes de escribir.'
      : errText(e);
  }
  render();
}

    const vr = valRow(L, () => ''); if (vr) writes.push([`${qs(t)}!${vr[0]}`, vr[1]]);
    if (L.gh >= 0) { writes.push([`${qs(t)}!A${L.gh + 2}:C${L.gh + 12}`, blank(11, 3)]); writes.push([`${qs(t)}!E${L.gh + 2}:H${L.gh + 12}`, blank(11, 4).map(r => [r[0], null, r[2], r[3]])]); }

// ===== ESTADÍSTICAS =====
async function loadStats(force = false) {
  if (!ready() || UI.statsProgress) return;
  const list = S.sheets.filter(s => force || !S.stats.sums[s.id]);
  if (!list.length) return;
  UI.statsProgress = { done: 0, total: list.length }; UI.err.stats = null; render();
  let fails = 0;
  try {
    const p = await call('batch_get', { ranges: list.map(s => `${qs(s.title)}!A1:M140`) }, { read: true });
    (p.valueRanges || []).forEach((vr, i) => {
      const sh = list[i];
      try { S.stats.sums[sh.id] = summarize(sh, parseLayout(vr.values || []), awayOf(sh.title)); } catch (e) { fails++; }
    });
  } catch (e) { UI.err.stats = errText(e); }

function rivalPlayer(m, dorsal, create = true) {

}
function addEvent(m, e) {

  if (m.clock.phase === 'h1' || m.clock.phase === 'h2') e.ts = Date.now(); // hora real, para medir el tiempo en cada posición
  m.events.push(e);
  for (const k of ['scorer', 'assist', 'og', 'pid', 'out', 'in']) if (e[k]) delete m.ov[e[k]];
  if (e.t === 'rgoal' && !e.og && e.dorsal) { const p = rivalPlayer(m, e.dorsal); if (p) { p.goals = (+p.goals || 0) + 1; p.fed = false; } }

}

  if (e.t === 'rcard') { const p = rivalPlayer(m, e.dorsal, false); if (p) { if (e.color === 'Y') p.y = Math.max(0, (+p.y || 0) - 1); else p.r = Math.max(0, (+p.r || 0) - 1); } }

const nameFmt = n => { n = str(n); if (n.includes(',')) { const [ap, no] = n.split(','); return title(no.trim()) + ' ' + title(ap.trim().split(/\s+/)[0]); } return title(n); };

function defaultScoutCod() {

function teamResults(cod) {

function scoutView(forceCod = null, embedded = false) {

  const tLabel = c => title(c[2]).replace(/^[A-Z]\.[A-Z]\.(?:[A-Z]\.)?\s*/i, '');
  const chips = embedded ? '' : `<div class="chips scroll">${FFCV_SNAP.clas.filter(c => c[1] !== APOLO_COD).sort((x, y) => tLabel(x).localeCompare(tLabel(y), 'es', { sensitivity: 'base' })).map(c => `<button class="chip ${c[1] === cod ? 'on' : ''}" data-act="scoutTeam" data-v="${c[1]}">${esc(tLabel(c))}</button>`).join('')}</div>`;

  const cards = P.filter(p => p.y || p.r).sort((a, b) => (b.r * 3 + b.y) - (a.r * 3 + a.y));

// ===== AVISOS (notificaciones push) =====
// La app guarda en la pestaña oculta «AVISOS» del Excel la configuración y la suscripción de este móvil.
// Un proceso en GitHub (cada 10 min) lee el Excel y manda los avisos: martes de horarios y día de partido.
const AV = { loaded: false, cfg: { martes: '10:00', antes: '2', partido: '1' }, rows: [], subscribed: null, busy: false, msg: '' };
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const b64uEnc = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/=+$/, '').replace(/\+/g, '-').replace(/\//g, '_');
const b64uDec = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
async function avisosEnsureSheet() {
  const meta = await call('get_spreadsheet', {}, { read: true });
  if (!(meta.sheets || []).some(x => x.properties.title === 'AVISOS'))
    await call('update_spreadsheet', { requests: [{ addSheet: { properties: { title: 'AVISOS', hidden: true, gridProperties: { rowCount: 600, columnCount: 4 } } } }] });
}
async function avisosLoad() {
  try {
    const p = await call('get_values', { range: `'AVISOS'!A1:D500` }, { read: true });
    AV.rows = (p.values || []).map(r => r.slice());
    for (const r of AV.rows) if (['martes', 'antes', 'partido', 'vapid_public'].includes(r[0])) AV.cfg[r[0]] = r[1] ?? '';
  } catch (e) { AV.rows = []; }
  AV.loaded = true;
  try { const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription(); AV.subscribed = !!sub && AV.rows.some(r => r[0] === 'sub' && str(r[1]).includes(sub.endpoint)); } catch (e) { AV.subscribed = false; }
  render();
}
function avSet(key, val) { const r = AV.rows.find(x => x[0] === key); if (r) r[1] = val; else AV.rows.unshift([key, val]); }
async function avisosWrite() {
  await avisosEnsureSheet();
  const rows = AV.rows.filter(r => r && r[0]);
  await call('clear_values', { range: `'AVISOS'!A1:D600` });
  if (rows.length) await writeVals(`'AVISOS'!A1:D${rows.length}`, rows.map(r => [r[0] ?? '', r[1] ?? '', r[2] ?? '', r[3] ?? '']));
}
function avisosCard() {
  if (ready() && !AV.loaded && !AV.loading) { AV.loading = true; avisosLoad(); }
  const c = AV.cfg;
  const state = !pushSupported() ? '<p class="muted small">Este navegador no admite avisos. En el iPhone hacen falta iOS 16.4 o posterior y abrir la app desde el icono de la pantalla de inicio.</p>'
    : !isStandalone() ? '<p class="muted small">Para recibir avisos, abre la app desde su icono en la pantalla de inicio (no desde Safari).</p>'
    : Notification.permission === 'denied' ? '<p class="muted small">Los avisos están bloqueados para esta app. Actívalos en Ajustes del iPhone › Notificaciones › Apolo.</p>'
    : AV.subscribed ? '<p class="ok small"><b>Avisos activados en este móvil.</b></p>' : '';
  const tSel = ['08:00', '09:00', '10:00', '11:00', '12:00', '13:00', '17:00', '18:00', '19:00', '20:00'];
  return `<div class="card avisos"><h3 class="h3">Avisos</h3>
    <label class="tgl"><input type="checkbox" data-av="martesOn" ${c.martes ? 'checked' : ''}><span>Recordatorio los martes para actualizar horarios</span></label>
    ${c.martes ? field('Hora del recordatorio', `<select data-av="martes">${tSel.map(t => `<option ${c.martes === t ? 'selected' : ''}>${t}</option>`).join('')}</select>`) : ''}
    <label class="tgl"><input type="checkbox" data-av="partido" ${c.partido !== '0' ? 'checked' : ''}><span>Día de partido: aviso antes de la citación</span></label>
    ${c.partido !== '0' ? field('Cuánto antes de la citación', `<select data-av="antes">${['1', '1.5', '2', '3', '4'].map(h => `<option value="${h}" ${String(c.antes) === h ? 'selected' : ''}>${h.replace('.5', ' h 30')}${h.includes('.') ? '' : ' h'}</option>`).join('')}</select>`) : ''}
    ${state}
    <div class="acts">${pushSupported() && isStandalone() && Notification.permission !== 'denied' && !AV.subscribed
      ? `<button class="btn primary" data-act="avEnable" ${AV.busy || !ready() ? 'disabled' : ''}>Activar avisos en este móvil</button>` : ''}
      ${AV.subscribed ? `<button class="btn" data-act="avTest">Probar</button><button class="btn ghost" data-act="avDisable">Desactivar en este móvil</button>` : ''}</div>
    ${AV.msg ? `<p class="muted small">${esc(AV.msg)}</p>` : ''}
    <p class="muted small">Los avisos llegan aunque la app esté cerrada. La hora y la citación se leen del Excel, así que si cambias la hora del partido, el aviso se ajusta solo. Pueden llegar con unos minutos de margen.</p></div>`;

async function avisosSaveCfg(msg) {
  AV.busy = true; render();
  try { avSet('martes', AV.cfg.martes || ''); avSet('antes', String(AV.cfg.antes || '2')); avSet('partido', AV.cfg.partido === '0' ? '0' : '1'); await avisosWrite(); AV.msg = msg || 'Guardado.'; }

// Ficha de una jugadora: una fila desplegable por jornada (barra de minutos + iconos), con el detalle dentro
// Posiciones según los huecos del sistema habitual (1.4.2.3.1)
const POS_NAME = { 1: 'POR', 2: 'LD', 3: 'LI', 4: 'DFC', 5: 'DFC', 6: 'MCD', 7: 'ED', 8: 'MCD', 9: 'DC', 10: 'MCO', 11: 'EI' };
function playerGames(p, A) {
  const full = 2 * H();
  const byN = Object.fromEntries(A.games.map(g => [g.n, g]));
  const icons = g => [
    g.g ? `<span class="ico" title="${g.g} gol${g.g > 1 ? 'es' : ''}">⚽${g.g > 1 ? `<sup>${g.g}</sup>` : ''}</span>` : '',
    g.ta ? `<span class="ico" title="Amarilla">🟨${g.ta > 1 ? `<sup>${g.ta}</sup>` : ''}</span>` : '',
    g.tr ? '<span class="ico" title="Roja">🟥</span>' : '',
    g.mvp ? '<span class="ico" title="MVP">⭐</span>' : '',
    g.cap ? '<i class="cap inl" title="Capitana">C</i>' : ''].join('');
  const res = n => { const s = byN[n]; if (!s || !s.final) return ''; const [a, b] = s.final; const k = a > b ? 'w' : a === b ? 'd' : 'l'; return `<span class="gres ${k}">${a}-${b}</span>`; };
  return `<div class="jgl">${p.games.map(g => {
    const conv = g.conv || g.played;
    // iconos junto al rival; la barra va sola en su línea para que todas las jornadas midan igual
    const head = `<span class="jn">J${g.n}</span><span class="jr"><span class="jrn">${esc(title(g.rival))}</span>${conv ? `<span class="jicons">${icons(g)}</span>` : ''}</span>${res(g.n)}
      <span class="jbar">${conv ? `<span class="bt">${g.min ? `<span class="bf" style="width:${Math.min(100, g.min / full * 100)}%"></span>` : ''}</span><b>${g.min ? g.min + "'" : "0'"}</b>` : '<em>No convocada</em>'}</span>`;
    if (!conv) return `<div class="jg off">${head}</div>`;
    const pos = str(g.pos).split(/\s+/).filter(Boolean);
    const rows = [
      ['Papel', g.tit ? 'Titular' : 'Suplente'],
      ['Minutos', `${g.min || 0}'`],
      [pos.length > 1 ? 'Posiciones' : 'Posición', pos.length ? [...new Set(pos.map(x => POS_NAME[+x] || x))].map(x => `<span class="poschip">${esc(x)}</span>`).join('') : '—'],
      g.g ? ['Goles', '⚽'.repeat(Math.min(g.g, 6)) + (g.g > 6 ? ` ×${g.g}` : '')] : null,
      g.a ? ['Asistencias', String(g.a)] : null,
      g.gp ? ['Gol en propia', String(g.gp)] : null,
      g.ta || g.tr ? ['Tarjetas', '🟨'.repeat(g.ta || 0) + (g.tr ? '🟥' : '')] : null,
      g.mvp ? ['MVP', '⭐ MVP del partido'] : null,
      g.cap ? ['Capitana', 'Sí'] : null,
    ].filter(Boolean);
    return `<details class="jg"><summary>${head}</summary><dl class="jdet">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></details>`;
  }).join('')}</div>`;
}

function minuteField(s) {

function plist(m, ids, act, extra = '') {

function renderSheet() {
  const root = $('#sheet'); if (!root) return;

  if (!s || !m) { root.innerHTML = ''; root.classList.remove('open'); return; }
  root.classList.add('open');
  const byId = rmap(m); const comp = compute(m, H());
  const onField = Object.values(comp.field);
  let h = '', body = '';
  const n = id => (id && byId[id] ? esc(title(byId[id].name)) : '');
  switch (s.type) {
    case 'slot': {
      const id = m.lineup[s.slot]; const placed = new Set(Object.values(m.lineup));
      const free = m.roster.filter(p => m.called[p.id] && !placed.has(p.id)).map(p => p.id);
      h = id ? `${n(id)} · hueco ${s.slot}` : `Hueco ${s.slot}`;
      body = (id ? `<div class="acts"><button class="btn ${m.captain === id ? 'on' : ''}" data-act="setCap" data-id="${esc(id)}">${IC.star} ${m.captain === id ? 'Es la capitana' : 'Hacer capitana'}</button><button class="btn" data-act="unslot">Quitar del once</button></div><h4 class="h4">Cambiar por</h4>` : '<h4 class="h4">¿Quién juega aquí?</h4>')

      break;
    }
    case 'enter': {
      const bench = m.roster.filter(p => m.called[p.id] && !onField.includes(p.id) && !comp.P[p.id].expelled).map(p => p.id);
      h = `Hueco ${s.slot} libre · ¿quién entra?`;
      body = (m.clock.phase === 'pre' ? '' : minuteField(s)) + (bench.length ? plist(m, bench, 'enterPick') : '<p class="muted small">No hay nadie disponible en el banquillo.</p>');
      break;
    }
    case 'bench': {
      const c = comp.P[s.pid];
      h = `${n(s.pid)} <small>en el banquillo${c ? ' · ' + c.min + "' jugados" : ''}</small>`;

        ${c && !c.expelled ? `<button class="btn primary" data-act="benchEnter">${IC.sub} Entrar al campo</button>` : ''}

        <p class="muted small">Las tarjetas en el banquillo cuentan igual en el Excel. Con roja ya no puede entrar.</p>`;
      break;
    }
    case 'player': {

      body = `<div class="acts grid">
        <button class="btn goal" data-act="goalFrom">${IC.ball} Gol</button>
        <button class="btn" data-act="cardFrom" data-v="Y">${IC.card('Y')} Amarilla</button>
        <button class="btn" data-act="cardFrom" data-v="R">${IC.card('R')} Roja</button>
        <button class="btn" data-act="subFrom">${IC.sub} Cambio</button>
        <button class="btn" data-act="outFrom">${IC.sub} Sale sin cambio</button>
        <button class="btn" data-act="moveFrom">${IC.move} Cambiar posición</button>
        <button class="btn" data-act="ogFrom">${IC.ball} Gol en propia</button>
        <button class="btn ${m.captain === s.pid ? 'on' : ''}" data-act="setCap" data-id="${esc(s.pid)}">${IC.star} Capitana</button></div>`;
      break;
    }
    case 'goal': {
      if (s.step === 'scorer') { h = '¿Quién ha marcado?'; body = plist(m, onField, 'gScorer', `<button data-act="gScorer" data-id=""><span class="disc">PP</span>Gol en propia puerta rival</button>`); }

  avEnable() {
    if (!ready()) return signIn('');

    AV.busy = true; AV.msg = 'Activando…'; render();
    (async () => {
      try {
        if (await perm !== 'granted') { AV.msg = 'No has dado permiso para los avisos.'; return; }
        await avisosLoad();
        let pub = AV.cfg.vapid_public, priv = (AV.rows.find(r => r[0] === 'vapid_private') || [])[1];
        if (!pub || !priv) { // claves propias de los avisos, generadas en el móvil y guardadas en tu Excel
          const kp = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']);
          pub = b64uEnc(await crypto.subtle.exportKey('raw', kp.publicKey)); priv = (await crypto.subtle.exportKey('jwk', kp.privateKey)).d;
          avSet('vapid_public', pub); avSet('vapid_private', priv); AV.cfg.vapid_public = pub;

        const reg = await navigator.serviceWorker.ready;
        let sub = await reg.pushManager.getSubscription();
        if (sub) { try { await sub.unsubscribe(); } catch (e) {} }
        sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uDec(pub) });
        const json = JSON.stringify(sub.toJSON());
        AV.rows = AV.rows.filter(r => !(r[0] === 'sub' && str(r[1]).includes(sub.endpoint)));
        AV.rows.push(['sub', json, /iphone|ipad/i.test(navigator.userAgent) ? 'iPhone' : 'Móvil', new Date().toISOString()]);
